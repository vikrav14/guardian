<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Guardian — keep watch over the people who matter">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Guardian">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Guardian</title>
  <link rel="manifest" href="manifest.json">

  <!-- Load Maps key from gitignored maps_key.js, then Maps JavaScript API -->
  <script src="maps_key.js"></script>
  <script>
    (function () {
      var key = window.GOOGLE_MAPS_API_KEY;
      if (!key) {
        console.error('Missing Google Maps key. Copy web/maps_key.js.example to web/maps_key.js');
        return;
      }
      var s = document.createElement('script');
      s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key);
      s.async = true;
      document.head.appendChild(s);
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
