<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Guardian — keep watch over the people who matter">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Guardian">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Guardian</title>
  <link rel="manifest" href="manifest.json">
  <script
    type="module"
    src="./assets/packages/model_viewer_plus/assets/model-viewer.min.js"
    defer>
  </script>

  <!-- Load Maps key from gitignored maps_key.js, then Maps JavaScript API -->
  <script src="maps_key.js"></script>
  <script>
    window.guardianMapsReady = new Promise(function (resolve, reject) {
      var key = window.GOOGLE_MAPS_API_KEY;
      if (!key) {
        console.error(
          'Missing Google Maps key. Copy web/maps_key.js.example to web/maps_key.js',
        );
        resolve();
        return;
      }
      window.__guardianMapsLoaded = function () {
        resolve();
        delete window.__guardianMapsLoaded;
      };
      var script = document.createElement('script');
      script.src =
        'https://maps.googleapis.com/maps/api/js?key=' +
        encodeURIComponent(key) +
        '&callback=__guardianMapsLoaded';
      script.async = true;
      script.defer = true;
      script.onerror = function () {
        reject(new Error('Google Maps JavaScript API failed to load'));
      };
      document.head.appendChild(script);
    });
  </script>
</head>
<body>
  <script>
    function loadFlutter() {
      var script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;
      document.body.appendChild(script);
    }
    guardianMapsReady.then(loadFlutter).catch(function (error) {
      console.error(error);
      loadFlutter();
    });
  </script>
</body>
</html>
